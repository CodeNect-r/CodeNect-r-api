spring.application.name=auth-service
server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5435/auth_db?options=-c TimeZone=UTC
#spring.datasource.url=jdbc:postgresql://localhost:5435/auth_db

spring.datasource.username=admin
spring.datasource.password=admin

spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'UTC'
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

jwt.secret=mysupersecurejwtsecretkeythatismorethan32byteslong
jwt.access.expiration=900000
jwt.refresh.expiration=604800000


internal.service.name=auth-service
internal.shared.secret=super-internal-secret
