spring.application.name=ai-service
server.port=8083

#spring.datasource.url=jdbc:postgresql://lovable-postgres:5432/ai_db
spring.datasource.url=jdbc:postgresql://localhost:5435/ai_db

spring.datasource.username=admin
spring.datasource.password=admin
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true

# ================= KAFKA =================
#spring.kafka.bootstrap-servers=lovable-kafka:9092
spring.kafka.bootstrap-servers=localhost:9091


spring.kafka.consumer.group-id=ai-service-group-v5
spring.kafka.consumer.auto-offset-reset=earliest

# 1. THIS IS THE FIX: Both must be StringDeserializer!
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# 2. Producer settings (Keep these as they are)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3

# 3. Consumer Polling Tuning (Keep these)
spring.kafka.consumer.properties.max.poll.interval.ms=600000
spring.kafka.consumer.max-poll-records=1

# 4. Logging and Topics
logging.level.org.springframework.kafka=INFO
logging.level.org.apache.kafka.clients.consumer=INFO
spring.kafka.listener.missing-topics-fatal=false

