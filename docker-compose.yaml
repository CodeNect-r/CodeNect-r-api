version: "3.9"

services:

  postgres:
    image: ankane/pgvector:latest
    container_name: lovable-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      TZ: UTC
      PGTZ: UTC
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lovable-network


  kafka:
    image: apache/kafka:3.7.0
    container_name: lovable-kafka
    restart: unless-stopped
    ports:
      - "9091:9091"
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: EXTERNAL://:9091,INTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: EXTERNAL://localhost:9091,INTERNAL://lovable-kafka:9092  
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@lovable-kafka:9093
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - lovable-network


  ai-service:
    build: ./ai-service
    container_name: ai-service
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: lovable-kafka:9092
      SPRING_DATASOURCE_URL: jdbc:postgresql://lovable-postgres:5432/ai_db
      JWT_SECRET: mysupersecurejwtsecretkeythatismorethan32byteslong
    networks:
      - lovable-network


  project-service:
    build: ./project-service
    container_name: project-service
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: lovable-kafka:9092
      SPRING_DATASOURCE_URL: jdbc:postgresql://lovable-postgres:5432/project_db
      JWT_SECRET: mysupersecurejwtsecretkeythatismorethan32byteslong
    networks:
      - lovable-network


  auth-service:
    build: ./auth-service
    container_name: auth-service
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://lovable-postgres:5432/project_db
      JWT_SECRET: mysupersecurejwtsecretkeythatismorethan32byteslong
    networks:
      - lovable-network
  nginx:
   image: nginx:latest
   container_name: nginx
   ports:
    - "80:80"
   volumes:
    - ./nginx/preview.conf:/etc/nginx/nginx.conf
    - ./nginx/dynamic:/etc/nginx/conf.d/dynamic

  


volumes:
  postgres_data:

networks:
  lovable-network:
    driver: bridge