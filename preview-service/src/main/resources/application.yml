server:
  port: 8085

spring:
  application:
    name: preview-service

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  datasource:
    url: jdbc:postgresql://localhost:5435/preview_db
    username: admin
    password: admin

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    bootstrap-servers: localhost:9091
    consumer:
      group-id: preview-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.value.default.type: "com.lovable.preview_service.dto.AiResponseEvent"

  main:
    allow-bean-definition-overriding: true

  task:
    scheduling:
      enabled: true
#
#logging:
#  level:
#    root: INFO
#    com.lovable.preview_service: DEBUG

# Custom configuration
services:
  project-service:
    base-url: http://localhost:8082/api/projects

docker:
  memory-limit: 512m
  cpu-limit: 0.5