spring.application.name=project-service

server.port=8082

#spring.datasource.url=jdbc:postgresql://lovable-postgres:5432/project_db
spring.datasource.url=jdbc:postgresql://localhost:5435/project_db
spring.datasource.username=admin
spring.datasource.password=admin

spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'UTC'
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

jwt.secret=mysupersecurejwtsecretkeythatismorethan32byteslong


#spring.kafka.bootstrap-servers=lovable-kafka:9092
spring.kafka.bootstrap-servers=localhost:9091

spring.kafka.consumer.group-id=project-service-group-v1
spring.kafka.consumer.auto-offset-reset=latest

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer


internal.service.name=project-service
internal.shared.secret=super-internal-secret