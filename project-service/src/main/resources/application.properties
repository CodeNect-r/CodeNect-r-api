spring.application.name=project-service

server.port=8082

#spring.datasource.url=jdbc:postgresql://lovable-postgres:5432/project_db
spring.datasource.url=jdbc:postgresql://localhost:5435/project_db
spring.datasource.username=admin
spring.datasource.password=admin

spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'UTC'
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

jwt.secret=mysupersecurejwtsecretkeythatismorethan32byteslong


#spring.kafka.bootstrap-servers=lovable-kafka:9092
spring.kafka.bootstrap-servers=localhost:9091

spring.kafka.consumer.group-id=project-service-group
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.value.default.type=com.lovable.project_service.dto.AiResponseEvent

